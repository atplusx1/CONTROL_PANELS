<!DOCTYPE html> 
<html lang="ar" dir="rtl"> 
<head> 
  <meta charset="utf-8"> 
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <title>ENVIGUARD Control Panel</title> 
  <style> 
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
      font-family: 'Consolas', 'Courier New', monospace; 
    } 
    body { 
      background-color: #080c14; 
      color: #ffffff; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
      justify-content: flex-start; 
      min-height: 100vh; 
      padding: 12px; 
      gap: 15px; 
    } 
    .oled-screen { 
      background: #000000; 
      border: 2px solid #1f293d; 
      border-radius: 12px; 
      padding: 12px 20px; 
      width: 100%; 
      max-width: 360px; 
      box-shadow: 0 0 12px rgba(0, 210, 211, 0.15); 
    } 
    .oled-title { 
      text-align: center; 
      font-size: 16px; 
      font-weight: bold; 
      color: #00d2d3; 
      letter-spacing: 1.5px; 
      border-bottom: 1px dashed #232f48; 
      padding-bottom: 6px; 
      margin-bottom: 10px; 
    } 
    .oled-row { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      font-size: 15px; 
      margin: 8px 0; 
      color: #00ffcc; 
    } 
    .oled-value { 
      color: #ffffff; 
      font-weight: bold; 
    } 
    .status-on { color: #2ed573 !important; } 
    .status-off { color: #ff4757 !important; } 

    .switch {
      position: relative;
      display: inline-block;
      width: 46px;
      height: 22px;
    }
    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }
    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #1f293d;
      transition: .4s;
      border-radius: 22px;
      border: 1px solid #00d2d3;
    }
    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: #ffffff;
      transition: .4s;
      border-radius: 50%;
    }
    input:checked + .slider {
      background-color: #00d2d3;
    }
    input:checked + .slider:before {
      transform: translateX(24px);
    }
    input:disabled + .slider {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .btn-mode {
      background: #111827;
      border: 1px solid #00d2d3;
      color: #ff9f43;
      padding: 6px 16px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
      font-family: inherit;
    }

    .range-input {
      width: 110px;
      accent-color: #00d2d3;
    }
    .range-input:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
  </style> 
</head> 
<body> 

  <div class="oled-screen"> 
    <div class="oled-title">SYSTEM MODE</div> 
    <div class="oled-row"> 
      <span>MODE :</span> 
      <button class="btn-mode" id="btnMode" onclick="toggleMode()">AUTO</button> 
    </div> 
  </div> 

  <div style="width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 15px;">
    
    <!-- SENSORS DATA -->
    <div class="oled-screen"> 
      <div class="oled-title">SENSORS STATUS</div> 
      <div class="oled-row"> 
        <span>TEMP :</span> 
        <input type="range" min="0" max="50" value="25" class="range-input" id="rangeTemp" oninput="updateSimValue('temp', this.value)" disabled>
        <span class="oled-value" id="lblSimTemp">25 C</span>
      </div> 
      <div class="oled-row"> 
        <span>HUM  :</span> 
        <input type="range" min="0" max="100" value="50" class="range-input" id="rangeHum" oninput="updateSimValue('hum', this.value)" disabled>
        <span class="oled-value" id="lblSimHum">50 %</span>
      </div> 
      <div class="oled-row"> 
        <span>WATER:</span> 
        <input type="range" min="0" max="100" value="50" class="range-input" id="rangeWater" oninput="updateSimValue('water', this.value)" disabled>
        <span class="oled-value" id="lblSimWater">50 %</span>
      </div> 
    </div> 

    <!-- ALARMS -->
    <div class="oled-screen"> 
      <div class="oled-title">SYSTEM ALARMS</div> 
      <div class="oled-row"> 
        <span>TEMP ALARM :</span> 
        <span class="oled-value status-on" id="alarmTemp">NORMAL</span> 
      </div> 
      <div class="oled-row"> 
        <span>HUM ALARM  :</span> 
        <span class="oled-value status-on" id="alarmHum">NORMAL</span> 
      </div> 
      <div class="oled-row"> 
        <span>WATER ALARM:</span> 
        <span class="oled-value status-on" id="alarmWater">NORMAL</span> 
      </div> 
    </div> 

    <!-- CONTROLS -->
    <div class="oled-screen"> 
      <div class="oled-title">ACTUATORS CONTROL</div> 
      <div class="oled-row"> 
        <span>FAN  :</span> 
        <label class="switch">
          <input type="checkbox" id="toggleFan" onchange="toggleDevice('fan', this.checked)" disabled>
          <span class="slider"></span>
        </label>
        <span class="oled-value status-off" id="lblFan">OFF</span> 
      </div> 
      <div class="oled-row"> 
        <span>PUMP :</span> 
        <label class="switch">
          <input type="checkbox" id="togglePump" onchange="toggleDevice('pump', this.checked)" disabled>
          <span class="slider"></span>
        </label>
        <span class="oled-value status-off" id="lblPump">OFF</span> 
      </div> 
    </div> 

  </div>

  <script> 
    let currentMode = "AUTO";

    function toggleMode() {
      currentMode = (currentMode === "AUTO") ? "MANUAL" : "AUTO";
      document.getElementById('btnMode').innerText = currentMode;
      
      let isManual = (currentMode === "MANUAL");
      
      // Enable/Disable controls based on Mode
      document.getElementById('rangeTemp').disabled = !isManual;
      document.getElementById('rangeHum').disabled = !isManual;
      document.getElementById('rangeWater').disabled = !isManual;
      document.getElementById('toggleFan').disabled = !isManual;
      document.getElementById('togglePump').disabled = !isManual;

      fetch(`/set?mode=${currentMode}`).catch(() => {});
    }

    function toggleDevice(device, state) {
      if (currentMode === "AUTO") return;

      let val = state ? "ON" : "OFF";
      if (device === 'fan') {
        let lbl = document.getElementById('lblFan');
        lbl.innerText = val;
        lbl.className = 'oled-value ' + (state ? 'status-on' : 'status-off');
      } else if (device === 'pump') {
        let lbl = document.getElementById('lblPump');
        lbl.innerText = val;
        lbl.className = 'oled-value ' + (state ? 'status-on' : 'status-off');
      }

      fetch(`/set?${device}=${val}`).catch(() => {});
    }

    function updateSimValue(param, val) {
      if (param === 'temp') {
        document.getElementById('lblSimTemp').innerText = val + ' C';
        document.getElementById('alarmTemp').innerText = val > 35 ? 'HIGH 🚨' : 'NORMAL';
        document.getElementById('alarmTemp').className = 'oled-value ' + (val > 35 ? 'status-off' : 'status-on');
      } else if (param === 'hum') {
        document.getElementById('lblSimHum').innerText = val + ' %';
        document.getElementById('alarmHum').innerText = val > 80 ? 'HIGH 🚨' : 'NORMAL';
        document.getElementById('alarmHum').className = 'oled-value ' + (val > 80 ? 'status-off' : 'status-on');
      } else if (param === 'water') {
        document.getElementById('lblSimWater').innerText = val + ' %';
        document.getElementById('alarmWater').innerText = val > 90 ? 'HIGH 🚨' : 'NORMAL';
        document.getElementById('alarmWater').className = 'oled-value ' + (val > 90 ? 'status-off' : 'status-on');
      }
      fetch(`/set?${param}=${val}`).catch(() => {});
    }

    function syncState(mode, fan, pump, temp, hum, water) {
      if(mode !== undefined) {
        currentMode = mode;
        document.getElementById('btnMode').innerText = mode;
        let isManual = (mode === "MANUAL");
        document.getElementById('rangeTemp').disabled = !isManual;
        document.getElementById('rangeHum').disabled = !isManual;
        document.getElementById('rangeWater').disabled = !isManual;
        document.getElementById('toggleFan').disabled = !isManual;
        document.getElementById('togglePump').disabled = !isManual;
      }
      if(fan !== undefined) {
        let isFanOn = fan.toUpperCase() === 'ON';
        document.getElementById('toggleFan').checked = isFanOn;
        let lbl = document.getElementById('lblFan');
        lbl.innerText = fan.toUpperCase();
        lbl.className = 'oled-value ' + (isFanOn ? 'status-on' : 'status-off');
      }
      if(pump !== undefined) {
        let isPumpOn = pump.toUpperCase() === 'ON';
        document.getElementById('togglePump').checked = isPumpOn;
        let lbl = document.getElementById('lblPump');
        lbl.innerText = pump.toUpperCase();
        lbl.className = 'oled-value ' + (isPumpOn ? 'status-on' : 'status-off');
      }
      if(temp !== undefined) {
        document.getElementById('rangeTemp').value = temp;
        document.getElementById('lblSimTemp').innerText = temp + ' C';
      }
      if(hum !== undefined) {
        document.getElementById('rangeHum').value = hum;
        document.getElementById('lblSimHum').innerText = hum + ' %';
      }
      if(water !== undefined) {
        document.getElementById('rangeWater').value = water;
        document.getElementById('lblSimWater').innerText = water + ' %';
      }
    }
  </script> 
</body> 
</html>
