<!DOCTYPE html>  
<html lang="ar" dir="rtl">  
<head>  
  <meta charset="utf-8">  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">  
  <title>ENVIGUARD Control Panel</title>  
  <style>  
    * {  
      box-sizing: border-box;  
      margin: 0;  
      padding: 0;  
      font-family: 'Consolas', 'Courier New', monospace;  
    }  
    body {  
      background-color: #080c14;  
      color: #ffffff;  
      display: flex;  
      flex-direction: column;  
      align-items: center;  
      justify-content: flex-start;  
      min-height: 100vh;  
      padding: 16px;  
      gap: 15px;  
    }  
    .oled-screen {  
      background: #000000;  
      border: 2px solid #1f293d;  
      border-radius: 12px;  
      padding: 14px 20px;  
      width: 100%;  
      max-width: 380px;  
      box-shadow: 0 0 15px rgba(0, 210, 211, 0.15);  
    }  
    .oled-title {  
      text-align: center;  
      font-size: 15px;  
      font-weight: bold;  
      color: #00d2d3;  
      letter-spacing: 1.5px;  
      border-bottom: 1px dashed #232f48;  
      padding-bottom: 8px;  
      margin-bottom: 12px;  
    }  
    .oled-row {  
      display: flex;  
      justify-content: space-between;  
      align-items: center;  
      font-size: 14px;  
      margin: 10px 0;  
      color: #00ffcc;  
    }  
    .oled-value {  
      color: #ffffff;  
      font-weight: bold;  
    }  
    .status-on { color: #2ed573 !important; }  
    .status-off { color: #ff4757 !important; }  

    .switch { 
      position: relative; 
      display: inline-block; 
      width: 46px; 
      height: 22px; 
    } 
    .switch input { 
      opacity: 0; 
      width: 0; 
      height: 0; 
    } 
    .slider { 
      position: absolute; 
      cursor: pointer; 
      top: 0; left: 0; right: 0; bottom: 0; 
      background-color: #1f293d; 
      transition: .4s; 
      border-radius: 22px; 
      border: 1px solid #00d2d3; 
    } 
    .slider:before { 
      position: absolute; 
      content: ""; 
      height: 14px; 
      width: 14px; 
      left: 3px; 
      bottom: 3px; 
      background-color: #ffffff; 
      transition: .4s; 
      border-radius: 50%; 
    } 
    input:checked + .slider { background-color: #00d2d3; } 
    input:checked + .slider:before { transform: translateX(24px); } 
    input:disabled + .slider { opacity: 0.3; cursor: not-allowed; } 

    .btn-mode { 
      background: #111827; 
      border: 1px solid #00d2d3; 
      color: #ff9f43; 
      padding: 6px 16px; 
      border-radius: 6px; 
      font-weight: bold; 
      cursor: pointer; 
      font-family: inherit; 
      transition: all 0.3s;
    } 
    .btn-mode:hover {
      background: #00d2d3;
      color: #000;
    }

    .range-input { 
      width: 110px; 
      accent-color: #00d2d3; 
      cursor: pointer;
    } 
  </style>  
</head>  
<body>  

  <div class="oled-screen">  
    <div class="oled-title">⚙️ SYSTEM MODE</div>  
    <div class="oled-row">  
      <span>MODE STATUS:</span>  
      <button class="btn-mode" id="btnMode" onclick="toggleMode()">AUTO</button>  
    </div>  
  </div>  

  <div style="width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 15px;"> 

    <div class="oled-screen">  
      <div class="oled-title">📊 SENSORS CONTROL</div>  
      <div class="oled-row">  
        <span>TEMP :</span>  
        <input type="range" min="0" max="50" value="25" class="range-input" id="rangeTemp" oninput="updateSimValue('temp', this.value)"> 
        <span class="oled-value" id="lblSimTemp">25 °C</span> 
      </div>  
      <div class="oled-row">  
        <span>HUM  :</span>  
        <input type="range" min="0" max="100" value="50" class="range-input" id="rangeHum" oninput="updateSimValue('hum', this.value)"> 
        <span class="oled-value" id="lblSimHum">50 %</span> 
      </div>  
    </div>  

    <div class="oled-screen">  
      <div class="oled-title">🚨 SYSTEM ALARMS</div>  
      <div class="oled-row">  
        <span>TEMP ALARM :</span>  
        <span class="oled-value status-on" id="alarmTemp">NORMAL</span>  
      </div>  
      <div class="oled-row">  
        <span>HUM ALARM  :</span>  
        <span class="oled-value status-on" id="alarmHum">NORMAL</span>  
      </div>  
    </div>  

    <div class="oled-screen">  
      <div class="oled-title">💨 ACTUATORS CONTROL</div>  
      <div class="oled-row">  
        <span>FAN STATE :</span>  
        <label class="switch"> 
          <input type="checkbox" id="toggleFan" onchange="manualToggleFan(this.checked)" disabled> 
          <span class="slider"></span> 
        </label> 
        <span class="oled-value status-off" id="lblFan">OFF</span>  
      </div>  
    </div>  

  </div> 

  <script>  
    let currentMode = "AUTO"; 
    let currentTemp = 25;
    let currentHum = 50;

    function toggleMode() { 
      currentMode = (currentMode === "AUTO") ? "MANUAL" : "AUTO"; 
      document.getElementById('btnMode').innerText = currentMode; 

      let isManual = (currentMode === "MANUAL"); 
      document.getElementById('toggleFan').disabled = !isManual; 

      processAutomation();

      fetch(`/set?mode=${currentMode}`).catch(() => {}); 
    } 

    function manualToggleFan(state) { 
      if (currentMode === "AUTO") return; 

      setFanState(state);
      fetch(`/set?fan=${state ? "ON" : "OFF"}`).catch(() => {}); 
    } 

    function updateSimValue(param, val) { 
      val = parseInt(val);
      if (param === 'temp') { 
        currentTemp = val;
        document.getElementById('lblSimTemp').innerText = val + ' °C'; 
        
        let isHigh = val > 35;
        document.getElementById('alarmTemp').innerText = isHigh ? 'HIGH 🚨' : 'NORMAL'; 
        document.getElementById('alarmTemp').className = 'oled-value ' + (isHigh ? 'status-off' : 'status-on'); 

      } else if (param === 'hum') { 
        currentHum = val;
        document.getElementById('lblSimHum').innerText = val + ' %'; 
        
        let isHigh = val > 80;
        document.getElementById('alarmHum').innerText = isHigh ? 'HIGH 🚨' : 'NORMAL'; 
        document.getElementById('alarmHum').className = 'oled-value ' + (isHigh ? 'status-off' : 'status-on'); 
      } 

      processAutomation();

      fetch(`/set?${param}=${val}`).catch(() => {}); 
    } 

    function processAutomation() {
      if (currentMode === "AUTO") {
        let shouldFanBeOn = currentTemp > 35;
        setFanState(shouldFanBeOn);
      }
    }

    function setFanState(isOn) {
      document.getElementById('toggleFan').checked = isOn; 
      let lbl = document.getElementById('lblFan'); 
      lbl.innerText = isOn ? "ON" : "OFF"; 
      lbl.className = 'oled-value ' + (isOn ? 'status-on' : 'status-off'); 
    }

    function syncState(mode, fan, temp, hum) { 
      if(mode !== undefined) { 
        currentMode = mode; 
        document.getElementById('btnMode').innerText = mode; 
        document.getElementById('toggleFan').disabled = (mode !== "MANUAL"); 
      } 
      if(temp !== undefined) { 
        currentTemp = parseInt(temp);
        document.getElementById('rangeTemp').value = temp; 
        document.getElementById('lblSimTemp').innerText = temp + ' °C'; 
      } 
      if(hum !== undefined) { 
        currentHum = parseInt(hum);
        document.getElementById('rangeHum').value = hum; 
        document.getElementById('lblSimHum').innerText = hum + ' %'; 
      } 
      if(fan !== undefined) { 
        setFanState(fan.toUpperCase() === 'ON');
      } else {
        processAutomation();
      }
    } 
  </script>  
</body>  
</html>
